# Render Blueprint — Warrly marketing + web vault (SPA)
services:
  - type: web
    name: warrly-webapp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npm install serve
    startCommand: npx serve -s dist -l $PORT
    autoDeploy: true
    branch: main
    envVars:
      - key: VITE_API_URL
        value: https://warrly-api.onrender.com
      - key: VITE_WEBAPP_ENABLED
        value: "true"
      - key: VITE_SITE_URL
        value: https://www.warrly.in
      - key: NODE_VERSION
        value: "22.14.0"
      # After adding www.warrly.in in Render Dashboard → Custom Domains,
      # set Hostinger DNS per SHIP notes (CNAME www → warrly-webapp.onrender.com).
